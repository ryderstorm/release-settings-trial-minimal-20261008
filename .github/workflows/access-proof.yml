name: Read-only access proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-proof:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify target and selected API coverage
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          def api(path, *args):
              return json.loads(subprocess.check_output(['gh', 'api', path, *args], text=True))
          actual = api('repos/' + repo)
          if actual['full_name'].lower() != repo.lower():
              raise SystemExit('Wrong repository identity')
          print(json.dumps({'repo': actual['full_name'], 'identity': 'Actions contents:read',
                            'rest_visible': {k:actual[k] for k in ['default_branch','has_issues','has_wiki'] if k in actual},
                            'rest_merge_keys_present': [k for k in ['allow_merge_commit','allow_squash_merge','delete_branch_on_merge'] if k in actual]}))
          owner, name = repo.split('/')
          query = 'query($owner:String!,$name:String!){repository(owner:$owner,name:$name){mergeCommitAllowed squashMergeAllowed rebaseMergeAllowed deleteBranchOnMerge}}'
          data = api('graphql', '-f', 'query=' + query, '-f', 'owner=' + owner, '-f', 'name=' + name)
          if data.get('errors') or data.get('data',{}).get('repository') is None:
              raise SystemExit('GraphQL coverage failed')
          print(json.dumps({'graphql': data['data']['repository']}))
          rulesets = api('repos/' + repo + '/rulesets?per_page=100')
          for item in rulesets:
              detail = api('repos/' + repo + '/rulesets/' + str(item['id']))
              print(json.dumps({'ruleset_id': item['id'], 'enforcement':detail['enforcement'],
                                'bypass_actors_key_present': 'bypass_actors' in detail,
                                'rule_types': [r['type'] for r in detail['rules']]}))
          print('Exact-repository read-only access verified; this does not prove write permissions or enforced protection.')
          PY
