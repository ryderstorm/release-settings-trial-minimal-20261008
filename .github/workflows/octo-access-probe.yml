name: Octo STS Access Proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        id: octo-sts
        with:
          scope: ${{ github.repository }}
          identity: octo-access-probe
      - name: Verify federated token reads this exact repository
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: gh api "repos/$GITHUB_REPOSITORY" --jq '{full_name,id}'
