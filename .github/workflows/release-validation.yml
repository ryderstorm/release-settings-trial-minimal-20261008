# Adapt main to the inspected release branch; preserve existing CI prerequisites.
# Safe validation template: even activation never publishes. Production is a separate approval.
name: Semantic Release Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: semantic-release-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.SEMANTIC_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Reject stale or mismatched release revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_SERVER_URL: ${{ github.server_url }}
          EXPECTED_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.parse
          u = urllib.parse.urlsplit(os.environ['GH_SERVER_URL'])
          if u.scheme != 'https' or not u.hostname or u.username or u.password or u.port or u.path not in ('', '/') or u.query or u.fragment:
              raise SystemExit('Invalid GitHub server URL')
          ref = os.environ['TARGET_REF']
          if not ref.startswith('refs/heads/'):
              raise SystemExit('Release requires a branch ref')
          path = 'repos/' + os.environ['TARGET_REPO'] + '/git/ref/' + urllib.parse.quote(ref.removeprefix('refs/'), safe='/')
          live = json.loads(subprocess.check_output(['gh', 'api', '--hostname', u.hostname, '--method', 'GET', path], text=True))
          local = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          expected = os.environ['EXPECTED_SHA']
          if live.get('ref') != ref or live.get('object', {}).get('sha') != expected or local != expected:
              raise SystemExit('Stale/mismatched release revision; rerun checks on current head')
          print('Release checkout and live branch match the tested event SHA')
          PY
      - name: No-operation semantic release
        uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_file: .releaserc.toml
          no_operation_mode: true
          build: false
          push: false
          vcs_release: false
